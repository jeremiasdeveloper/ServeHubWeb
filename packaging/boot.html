<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ServeHub — Iniciando</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #E85D75 0%, #FFB7C5 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 24px; text-align: center; }
  .logo {
    position: relative; width: 112px; height: 112px; border-radius: 28px;
    background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 800; color: #E85D75;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .ring {
    position: absolute; inset: -20px; border-radius: 9999px;
    border: 2px solid rgba(255,255,255,.35);
    animation: ring 2.2s ease-out infinite;
  }
  h1 { margin-top: 34px; font-size: 32px; font-weight: 800; letter-spacing: -.5px; text-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .tagline { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.85); }
  .status { margin-top: 44px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,.95); }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  .warning {
    display: none; margin-top: 28px; max-width: 440px; padding: 18px 22px;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35);
    border-radius: 14px; font-size: 13px; line-height: 1.55; backdrop-filter: blur(6px);
  }
  .warning .reason { margin-top: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; opacity: .85; word-break: break-word; }
  .warning button {
    margin-top: 14px; padding: 9px 20px; border: none; border-radius: 8px;
    background: #fff; color: #E85D75; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .warning button:hover { background: #ffeef1; }
  .footer { position: fixed; bottom: 18px; font-size: 12px; color: rgba(255,255,255,.7); }
  @@keyframes spin { to { transform: rotate(360deg); } }
  @@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @@keyframes ring { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
</style>
</head>
<body>
  <div class="wrap">
    <div style="position:relative">
      <div class="ring"></div>
      <div class="logo">S</div>
    </div>
    <h1>ServeHub</h1>
    <div class="tagline">Operaciones de restaurante en tiempo real</div>
    <div class="status">
      <div class="spinner"></div>
      <span id="status">Iniciando servidor del restaurante…</span>
    </div>
    <div class="warning" id="warning">
      El servidor no pudo iniciar. Revisa el archivo de registro en
      <code>%APPDATA%\com.servehub.app\logs\servehub.log</code>.
      <div class="reason" id="reason"></div>
      <button id="retry">Reintentar</button>
    </div>
  </div>
  <div class="footer">ServeHub · Restaurant Operations</div>

<script>
  // No network calls happen here on purpose. A fetch from the tauri:// asset
  // origin to http://127.0.0.1:3000 is cross-origin and blocked by CORS, so
  // the shell's Rust side owns readiness detection and drives the navigation.
  var started = Date.now();

  function invoke(cmd, args) {
    var internals = window.__TAURI_INTERNALS__;
    if (internals && typeof internals.invoke === "function") {
      return internals.invoke(cmd, args || {});
    }
    var tauri = window.__TAURI__;
    if (tauri && tauri.core && typeof tauri.core.invoke === "function") {
      return tauri.core.invoke(cmd, args || {});
    }
    return Promise.reject(new Error("tauri bridge unavailable"));
  }

  // Simple elapsed-time readout so a slow start looks alive instead of frozen.
  setInterval(function () {
    var el = document.getElementById("status");
    if (!el || document.getElementById("warning").style.display === "block") return;
    var secs = Math.floor((Date.now() - started) / 1000);
    el.textContent = "Iniciando servidor del restaurante… (" + secs + " s)";
  }, 1000);

  document.getElementById("retry").addEventListener("click", function () {
    var warning = document.getElementById("warning");
    var status = document.getElementById("status");
    warning.style.display = "none";
    status.textContent = "Reiniciando servidor del restaurante…";
    started = Date.now();
    invoke("restart_server").catch(function () {
      warning.style.display = "block";
      document.getElementById("reason").textContent = "No se pudo solicitar el reinicio.";
    });
  });
</script>
</body>
</html>
