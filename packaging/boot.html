<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ServeHub — Iniciando</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #E85D75 0%, #FFB7C5 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; -webkit-user-select: none; user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; padding: 24px; text-align: center; }
  .logo {
    position: relative; width: 112px; height: 112px; border-radius: 28px;
    background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 800; color: #E85D75;
    animation: pulse 2.2s ease-in-out infinite;
  }
  .ring {
    position: absolute; inset: -20px; border-radius: 9999px;
    border: 2px solid rgba(255,255,255,.35);
    animation: ring 2.2s ease-out infinite;
  }
  h1 { margin-top: 34px; font-size: 32px; font-weight: 800; letter-spacing: -.5px; text-shadow: 0 2px 12px rgba(0,0,0,.15); }
  .tagline { margin-top: 8px; font-size: 14px; color: rgba(255,255,255,.85); }
  .status { margin-top: 44px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,.95); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  .warning {
    display: none; margin-top: 28px; max-width: 420px; padding: 16px 20px;
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35);
    border-radius: 14px; font-size: 13px; line-height: 1.5; backdrop-filter: blur(6px);
  }
  .warning button {
    margin-top: 10px; padding: 8px 18px; border: none; border-radius: 8px;
    background: #fff; color: #E85D75; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  .footer { position: fixed; bottom: 18px; font-size: 12px; color: rgba(255,255,255,.7); }
  @@keyframes spin { to { transform: rotate(360deg); } }
  @@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @@keyframes ring { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
</style>
</head>
<body>
  <div class="wrap">
    <div style="position:relative">
      <div class="ring"></div>
      <div class="logo">S</div>
    </div>
    <h1>ServeHub</h1>
    <div class="tagline">Operaciones de restaurante en tiempo real</div>
    <div class="status">
      <div class="spinner"></div>
      <span id="status">Iniciando servidor del restaurante…</span>
    </div>
    <div class="warning" id="warning">
      El servidor está tardando más de lo esperado en arrancar.
      ServeHub seguirá intentando conectar automáticamente.
      <br />
      <button onclick="checkNow()">Reintentar ahora</button>
    </div>
  </div>
  <div class="footer">ServeHub · Restaurant Operations</div>

<script>
  var SERVER = "http://localhost:3000";
  var started = Date.now();
  var warned = false;

  function updateStatus() {
    var secs = Math.floor((Date.now() - started) / 1000);
    document.getElementById("status").textContent =
      "Iniciando servidor del restaurante… (" + secs + " s)";
    if (!warned && secs > 30) {
      warned = true;
      document.getElementById("warning").style.display = "block";
    }
  }

  function checkNow() {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 3000);
    fetch(SERVER + "/api/health", { signal: controller.signal, cache: "no-store" })
      .then(function (res) {
        clearTimeout(timer);
        if (res.ok) {
          document.getElementById("status").textContent = "Servidor listo. Abriendo ServeHub…";
          window.location.replace(SERVER + "/?servehub_desktop=1");
        }
      })
      .catch(function () { clearTimeout(timer); });
  }

  setInterval(updateStatus, 1000);
  setInterval(checkNow, 800);
  checkNow();
</script>
</body>
</html>
